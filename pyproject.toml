[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "blackjack-tutor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pygame>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pre-commit>=3", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=analytics --cov=coach --cov=core --cov=persistence --cov=strategy --cov=util --cov-report=term-missing"

[tool.coverage.run]
source = ["analytics", "coach", "core", "persistence", "strategy", "util"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
